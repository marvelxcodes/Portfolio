<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Imitation Engine</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9552a"/>
      <stop offset="100%" stop-color="#c74a20"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <mask id="clip">
      <rect width="512" height="512" fill="white"/>
      <circle cx="256" cy="256" r="68" fill="black"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="124" fill="url(#tile)"/>
  <g mask="url(#clip)">
    <g transform="translate(256 256)">
      <g transform="rotate(0) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(30) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(60) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(90) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(120) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(150) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(180) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(210) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(240) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(270) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(300) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
      <g transform="rotate(330) rotate(16 0 -124)"><rect x="-18.4" y="-188" width="36.8" height="132" rx="18.4" fill="url(#ray)"/></g>
    </g>
  </g>
</svg>
